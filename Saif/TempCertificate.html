<!doctype html>
<meta charset="utf-8">
<title>Certificate</title>
<!-- This page moved to ../cert/. It forwards old course links there with this page's settings. -->
<script>
(function () {
  var settings = {"client": "Saif", "mode": "manual", "time": "12"};
  var q = new URLSearchParams(settings);
  var old = location.href.split("?print=")[1];
  if (old) {
    var parts = old.split("#")[0].split("&");
    function dec(s) { try { return decodeURIComponent(s); } catch (e) { try { return decodeURI(s); } catch (e2) { return s; } } }
    q.set("name", dec(parts[0] || ""));
    q.set("module", dec(parts[1] || ""));
    q.set("date", dec(parts[2] || ""));
  }
  location.replace("../cert/?" + q.toString());
})();
</script>
